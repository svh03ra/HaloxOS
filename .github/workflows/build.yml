name: Build 1.1 Development

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            nasm \
            gcc \
            binutils \
            grub-pc-bin \
            grub-common \
            xorriso \
            mtools \
            dosfstools \
            parted \
            gzip \
            python3 \
            pkg-config \
            libpng-dev \
            qemu-system-x86

      - name: Build CD-ROM
        run: make

      - name: Build Disk
        run: make disk

      - name: Build Floppy
        run: make floppy

      - name: Verify Build
        run: |
          test -s build/HaloxOS-LiveCD_DEV.iso
          test -s build/HaloxOS-Disk_DEV.img
          test -s build/HaloxOS-Floppy_DEV.img
          echo "All builds are ready:"
          ls -lh build/HaloxOS-LiveCD_DEV.iso build/HaloxOS-Disk_DEV.img build/HaloxOS-Floppy_DEV.img
