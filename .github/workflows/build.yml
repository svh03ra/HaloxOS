name: Build 1.1 Release

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            nasm \
            gcc \
            binutils \
            grub-pc-bin \
            grub-common \
            xorriso \
            mtools \
            dosfstools \
            parted \
            zstd \
            python3 \
            pkg-config \
            libpng-dev \
            qemu-utils \
            qemu-system-x86

      - name: Build CD-ROM
        run: make -j4

      # Brand aliases from the Makefile: vmware -> vmdk, qemu -> qcow2,
      # hyper-v -> vhd, virtualbox -> vdi. Each depends on `disk`.
      - name: Build disk and hypervisor images
        run: make -j4 disk vmware qemu hyper-v virtualbox

      - name: Build USB image
        run: make -j4 usb

      # Last on purpose: the floppy target rebuilds the kernel with the
      # embedded WAD disabled so it fits 1.44 MB, and nothing after it
      # should pick that kernel up.
      - name: Build Floppy
        run: make -j4 floppy

      - name: Verify build output
        run: |
          status=0
          for f in \
            build/out/HaloxOS-LiveCD_1.1.iso \
            build/out/HaloxOS-Disk_1.1.img \
            build/out/HaloxOS-Disk_1.1.vmdk \
            build/out/HaloxOS-Disk_1.1.qcow2 \
            build/out/HaloxOS-Disk_1.1.vhd \
            build/out/HaloxOS-Disk_1.1.vdi \
            build/out/HaloxOS-USB_1.1.img \
            build/out/HaloxOS-Floppy_1.1.img; do
            if [ -s "$f" ]; then
              ls -lh "$f"
            else
              echo "::error::Missing build output: $f"
              status=1
            fi
          done
          [ "$status" -eq 0 ] || exit 1
          echo "All images are ready in build/out/"

      - name: Verify USB image
        run: |
          img=build/out/HaloxOS-USB_1.1.img
          ls -lh "$img"
          sig=$(dd if="$img" bs=1 skip=510 count=2 status=none | od -An -tx1 | tr -d ' \n')
          echo "MBR signature: $sig"
          [ "$sig" = "55aa" ] || { echo "::error::$img has no 0x55AA boot signature"; exit 1; }
          parted -s "$img" unit s print
          parted -s "$img" unit s print | grep -q "fat32" \
            || { echo "::error::$img has no FAT32 partition"; exit 1; }
          parted -s "$img" unit s print | grep -q "boot" \
            || { echo "::error::$img partition is not marked bootable"; exit 1; }
          mdir -i "$img@@1048576" ::/boot
          mdir -i "$img@@1048576" ::/boot/loader.elf >/dev/null \
            || { echo "::error::loader.elf missing from the USB image"; exit 1; }
          mdir -i "$img@@1048576" ::/boot/kernel.bin.zst >/dev/null \
            || { echo "::error::kernel.bin.zst missing from the USB image"; exit 1; }
          mdir -i "$img@@1048576" ::/boot/grub/grub.cfg >/dev/null \
            || { echo "::error::grub.cfg missing from the USB image"; exit 1; }
          echo "USB image is bootable: MBR signature, bootable FAT32 partition and boot payload verified"
