set timeout=0
set default=0

# 4-bit builds use native VGA mode 12h from the kernel.
# 8/16-bit builds require GRUB to hand the kernel a Multiboot framebuffer;
# the kernel itself does not have a protected-mode VBE BIOS call path.
# Keep the configured depth first, with only compatible high-colour fallbacks.

menuentry "HaloxOS!" {
    terminal_output console
    insmod all_video
    set gfxpayload=640x480x16,640x480x15,640x480x8
    multiboot /boot/kernel.bin
    boot
}