# The Makefile-generated boot configs use the configured resolution ladder.

set timeout_style=hidden
set timeout=0
set default=0
terminal_output console
echo "[GRUB] configuration loaded; locating boot filesystem"
insmod serial
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial
search --no-floppy --file --set=root /boot/grub/grub.cfg
echo "[GRUB] boot filesystem found"

menuentry "HaloxOS!" {
    echo "[GRUB] boot entry selected"
    insmod vbe
    echo "[GRUB] VBE module loaded"
    set gfxpayload=640x480x16,640x480x15,640x480x8
    echo "[GRUB] gfxpayload set; next: multiboot loader"
    multiboot /boot/loader.elf halox.boot=$root
    echo "[GRUB] loader accepted; next: load kernel module"
    module /boot/kernel.bin.zst
    # The WAD module is optional, so its load is routed to the serial trace
    # only: on a machine at the 5 MB boot floor GRUB cannot stage the 4 MB
    # module and would otherwise print "error: out of memory." on the console
    # before the kernel falls back to reading the WAD from the boot medium.
    terminal_output serial
    module /boot/doom.wadmodule
    terminal_output console serial
    echo "[GRUB] modules loaded; transferring control"
    boot
}
